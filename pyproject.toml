[project]
name = "griptape-nodes-library-jev"
version = "0.1.0"
description = "Griptape Nodes for asking TypeSafe's JEV model typed questions about text"
authors = [{ name = "Jason Schleifer", email = "jason.schleifer@gmail.com" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[tool.uv.sources]
griptape-nodes-engine = { git = "https://github.com/griptape-ai/griptape-nodes-engine", rev = "latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_nodes"]

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest", "griptape-nodes-engine"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["workflows/templates/*.py"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates", "workflows/"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
